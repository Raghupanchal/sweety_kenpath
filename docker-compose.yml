version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: sweety_postgres
    restart: always
    environment:
      POSTGRES_DB: sweety_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express.js Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sweety_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/sweety_db
      JWT_SECRET: sweety_jwt_production_secret_key_change_me
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend (Vite)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sweety_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
